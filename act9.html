<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html><head></head><body>












<div class="container">

<header>
<h1>Student Information Form</h1>
<p>Senior High School Enrollment • Grade 11</p>
</header>





<fieldset>

<legend>Personal Information</legend>

<div class="photo">
<img src="steven.jpg" alt="Student Photo" width="180"/>
</div>

<div class="row">

<div class="input-box">
<label>First Name</label>

</div>

<div class="input-box">
<label>Last Name</label>

</div>

<div class="input-box">
<label>Middle Initial</label>

</div>

</div>

<div class="row">

<div class="input-box">
<label>Email Address</label>

</div>

<div class="input-box">
<label>Password</label>

</div>

</div>

<div class="row">

<div class="input-box">
<label>Age</label>

</div>

<div class="input-box">
<label>Birthday</label>

</div>

</div>

<div class="input-box">
<label>Contact Number</label>

</div>

</fieldset>



<fieldset>

<legend>Student Information</legend>

<div class="input-box">
<label>Student ID</label>

</div>

<div class="row">

<div class="input-box">
<label>Grade Level</label>


<option>Select Grade Level</option>
<option>Grade 11</option>
<option>Grade 12</option>


</div>

<div class="input-box">

<label>Strand</label>


<option>Select Strand</option>
<option>ICT</option>
<option>STEM</option>
<option>ABM</option>
<option>HUMSS</option>
<option>GAS</option>


</div>

</div>

</fieldset>



<fieldset>

<legend>Additional Information</legend>

<label>Gender</label>

<div class="radio-group">

<label> Male</label>

<label> Female</label>

<label> Prefer not to say</label>

</div>

<br/>

<label>Hobbies</label>

<div class="checkbox-group">

<label> Reading</label>

<label> Coding</label>

<label> Playing Sports</label>

<label> Watching Movies</label>

<label> Playing Games</label>

<label> Music</label>

</div>

<br/>

<div class="input-box">

<label>Complete Address</label>



<small>Maximum of 250 characters.</small>

</div>

</fieldset>

<div class="buttons">

Submit

Reset

</div>



</div>

					if (document.querySelector('math, .d2l-element, .d2l-cplus-layout') || /\$\$|\\\(|\\\[|\\begin{|\\ref{|\\eqref{/.test(document.body.innerHTML)) {
						document.querySelectorAll('mspace[linebreak="newline"]').forEach(elm => {
							elm.setAttribute('style', 'display: block; height: 0.5rem;');
						});

						document.querySelectorAll('math mmultiscripts > none').forEach(elm => {
							const mrow = document.createElementNS('http://www.w3.org/1998/Math/MathML', 'mrow');
							elm.replaceWith(mrow);
						});

						window.D2L.MathJax.loadMathJax({
							outputScale: 1.5,
							renderLatex: false,
							enableMML3Support: false
						});
					}
				});</script><script type="module" src="https://s.brightspace.com/lib/bsi/2026.7.210/unbundled/prism.js"></script><script type="text/javascript">document.addEventListener('DOMContentLoaded', function() {

					});
				});</script><script type="module" src="https://s.brightspace.com/lib/bsi/2026.7.210/unbundled/embeds.js"></script><script type="text/javascript">document.addEventListener('DOMContentLoaded', function() {

				});</script></body></html>
